<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samu 地方美食餐廳列表 Bootstrap - Table(表格)</Table>
  </title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/myall.css">
  <style>
    /* 手機RWD 768px */
    @media screen and (max-width: 768px) {
      .table-rwd thead {
        display: none;
      }

      .table-rwd tbody tr {
        display: block;
        margin-top: 15px;
        border: 2px solid #d16464;
      }

      .table-rwd tbody tr td {
        display: block;
        overflow: hidden;
      }

      /* 偽元素 */
      .table-rwd tbody tr td::before {
        content: attr(data-th) ":";
        font-size: 20px;
        font-weight: 900;
        display: block;
        float: left;
        width: 30%;
        text-align: right;
        padding-right: 15px;
        color: #d16464;
      }

      .table-rwd tbody tr td span {
        display: block;
        float: left;
        width: 70%;
      }
    }
  </style>

</head>

<body>
  <div class="container">

    <div class="display-2 fw-900 text-center mt-4">地方美食餐廳列表</div>

    <table class="table table-bordered table-rwd">
      <thead class="table-dark text-center">
        <tr>
          <th width="10%">餐廳名稱</th>
          <th width="25%">餐廳圖片</th>
          <th width="20%">餐廳地址</th>
          <th width="10%">餐廳電話</th>
          <th width="10%">餐廳信箱</th>
          <th width="25%">餐廳簡介</th>
        </tr>
      </thead>
      <tbody id="mytbody">
        <tr>
          <td data-th="餐廳名稱"><span>XXXX</span></td>
          <td data-th="餐廳圖片"><span><img src="images/egg__c01.png" class="img-fluid" alt=""></span></td>
          <td data-th="餐廳地址"><span>XXXX</span></td>
          <td data-th="餐廳電話"><span>XXXX</span></td>
          <td data-th="餐廳信箱"><span>XXXX</span></td>
          <td data-th="餐廳簡介">
            <span class="text-truncate" style="max-width: 450px; display: block;">是我關鍵字小孩利益機場來源記住來到舉辦，創業走勢有點大幅公路集中看起來，練習類別城市學者另外歌曲以後課堂實在，還能人士投資者各位有限責任公司，官員開關欣賞經濟發展通知。</span>
          </td>
        </tr>

      </tbody>
    </table>



  </div><!-- div container -->


  <!-- <ul class="nav justify-content-center">
    <li class="nav-item">
      <a class="nav-link disabled" fw-900>POWER BY Samu 2026
      </a>
    </li>
  </ul> -->


  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/jquery-4.0.0.js"></script>

  <script>
    //主程式：開始必定執行的地方
    $(function () {
      //抓取外部資料 - 農村地方美食小吃特色料理
      $.ajax({
        type: "GET",
        url: "https://data.moa.gov.tw/Service/OpenData/ODwsv/ODwsvTravelFood.aspx?IsTransData=1&UnitId=193",
        dataType: "json",
        success: showdata,
        error: function () {
          console.log("抓取外部資料 - 農村地方美食小吃特色料理 - 失敗!");
        }
      });
    });



    //自訂函式 副程式
    function showdata(data) {
      console.log(data);

      // $("#mytbody").empty();

      data.forEach(function (item) {
        console.log(item.Name);

        const strHTML = `<tr>
                            <td data-th="餐廳名稱"><span>${item.Name}</span></td>
                            <td data-th="餐廳圖片"><span><img src="${item.PicURL}" class="img-fluid" alt=""></span></td>
                            <td data-th="餐廳地址"><span>${item.City}${item.Town}${item.Address}</span></td>
                            <td data-th="餐廳電話"><span>${item.Tel}</span></td>
                            <td data-th="餐廳信箱"><span>${item.Email}</span></td>
                            <td data-th="餐廳簡介"><span class="text-truncate" style="max-width: 450px; display: block;">${item.FoodFeature}</span>
                            </td>
                        </tr>`;
        $("#mytbody").append(strHTML);

      });
    }
  </script>


</body>

</html>
